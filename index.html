const pinBar = document.getElementById('pinBar');
const pinText = document.getElementById('pinText');
const pinClose = document.getElementById('pinClose');

const typingIndicator = document.getElementById('typingIndicator');
const typingText = document.getElementById('typingText');

const replyPreview = document.getElementById('replyPreview');
const rpName = document.getElementById('rpName');
const rpText = document.getElementById('rpText');
const rpClose = document.getElementById('rpClose');

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');

const reactionPicker = document.getElementById('reactionPicker');

/* ============================================================
   Constants
   ============================================================ */
const MAX_FILE_BYTES  = 700 * 1024;
const MAX_IMAGE_BYTES = 300 * 1024;
const MAX_VOICE_BYTES = 400 * 1024;
const VOICE_MAX_MS    = 60 * 1000;
const VOICE_BITRATE   = 24000;
const MAX_MSGS_PER_ROOM = 1000;
const SYNC_CHUNK_SIZE = 20;
const SYNC_DEDUP_WINDOW = 1500;

const HEARTBEAT_INTERVAL = 25000;
const WATCHDOG_INTERVAL  = 15000;
const STALE_THRESHOLD    = 45000;
const RECONNECT_COOLDOWN = 3000;

const TYPING_DEBOUNCE = 1500;
const TYPING_TIMEOUT  = 3500;
const PRESENCE_INTERVAL = 20000;
const PRESENCE_TIMEOUT  = 45000;

const STORAGE_KEY_NAME = 'mqtt_chat_username';
const STORAGE_KEY_ROOM = 'mqtt_chat_room';
const STORAGE_KEY_ID   = 'mqtt_chat_userid';
const STORAGE_KEY_THEME = 'mqtt_chat_theme';
const STORAGE_KEY_COLOR = 'mqtt_chat_accent';
const STORAGE_KEY_PIN  = 'mqtt_chat_pinned_';

/* ============================================================
   State
   ============================================================ */
let client = null;
let isConnected = false;
let myId = null;
let myName = null;
let currentRoom = null;
let currentTopic = null;
let db = null;
let connectSeq = 0;
let lastServerActivity = 0;
let heartbeatTimer = null;
let watchdogTimer = null;
let reconnectTimer = null;
let lastReconnectAt = 0;
let intentionalDisconnect = false;

let typingTimer = null;
let lastTypingSent = 0;
let remoteTypingTimer = null;
let presenceTimer = null;

let replyTo = null;
let pinnedMessageId = null;

const messagesCache = new Map();
const onlineUsers = new Map();

/* ============================================================
   Toast
   ============================================================ */
let toastTimer = null;
function showToast(text, duration = 1800, isError = false) {
  toastEl.textContent = text;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

/* ============================================================
   Confirm Modal
   ============================================================ */
let modalResolve = null;
function showConfirm(title, text, confirmLabel = 'تأیید') {
  return new Promise((resolve) => {
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalConfirm.innerHTML = '<svg class="ic ic-sm"><use href="#i-check"/></svg>' + confirmLabel;
    modalOverlay.classList.add('active');
    modalResolve = resolve;
  });
}
modalCancel.onclick = () => {
  modalOverlay.classList.remove('active');
  if (modalResolve) { modalResolve(false); modalResolve = null; }
};
modalConfirm.onclick = () => {
  modalOverlay.classList.remove('active');
  if (modalResolve) { modalResolve(true); modalResolve = null; }
};

/* ============================================================
   Theme + Accent
   ============================================================ */
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  const useEl = themeToggle.querySelector('use');
  if (useEl) useEl.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  localStorage.setItem(STORAGE_KEY_THEME, theme);
}
function hexToRgb(hex) {
  const num = parseInt(hex.replace('#',''), 16);
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}
function applyAccent(color) {
  document.documentElement.style.setProperty('--accent', color);
  const c2 = shadeColor(color, -20);
  document.documentElement.style.setProperty('--accent-2', c2);
  document.documentElement.style.setProperty('--accent-hover', shadeColor(color, -15));
  const rgb = hexToRgb(color);
  document.documentElement.style.setProperty('--accent-rgb', rgb.join(','));
  const rgb2 = hexToRgb(c2);
  document.documentElement.style.setProperty('--accent-2-rgb', rgb2.join(','));
  localStorage.setItem(STORAGE_KEY_COLOR, color);
  document.querySelectorAll('.color-picker .swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === color);
  });
}
function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

themeToggle.onclick = () => {
  const cur = document.body.getAttribute('data-theme') || 'dark';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};
colorToggle.onclick = (e) => {
  e.stopPropagation();
  colorPicker.classList.toggle('active');
  menuPopup.classList.remove('active');
};
document.querySelectorAll('.color-picker .swatch').forEach(sw => {
  sw.onclick = () => {
    applyAccent(sw.dataset.color);
    colorPicker.classList.remove('active');
  };
});
document.addEventListener('click', (e) => {
  if (!colorPicker.contains(e.target) && e.target !== colorToggle && !colorToggle.contains(e.target)) {
    colorPicker.classList.remove('active');
  }
  if (!menuPopup.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
    menuPopup.classList.remove('active');
  }
  if (!reactionPicker.contains(e.target)) {
    reactionPicker.classList.remove('active');
  }
});

menuBtn.onclick = (e) => {
  e.stopPropagation();
  menuPopup.classList.toggle('active');
  colorPicker.classList.remove('active');
};

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME = 'mqtt-chat-db';
const DB_VERSION = 2;
const STORE_MSGS = 'messages';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_MSGS)) {
        const store = d.createObjectStore(STORE_MSGS, { keyPath: 'msgId' });
        store.createIndex('by_room_time', ['room', 'time'], { unique: false });
        store.createIndex('by_room', 'room', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbAdd(msg) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('db not ready'));
    const tx = db.transaction(STORE_MSGS, 'readwrite');
    tx.objectStore(STORE_MSGS).put(msg);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function dbUpdate(msgId, updates) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('db not ready'));
    const tx = db.transaction(STORE_MSGS, 'readwrite');
    const store = tx.objectStore(STORE_MSGS);
    const req = store.get(msgId);
    req.onsuccess = () => {
      const data = req.result;
      if (data) { Object.assign(data, updates); store.put(data); }
    };
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function dbDelete(msgId) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('db not ready'));
    const tx = db.transaction(STORE_MSGS, 'readwrite');
    tx.objectStore(STORE_MSGS).delete(msgId);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function dbHas(msgId) {
  return new Promise((resolve) => {
    if (!db) return resolve(false);
    const tx = db.transaction(STORE_MSGS, 'readonly');
    const req = tx.objectStore(STORE_MSGS).get(msgId);
    req.onsuccess = () => resolve(!!req.result);
    req.onerror = () => resolve(false);
  });
}

function dbGetAllByRoom(room) {
  return new Promise((resolve) => {
    if (!db) return resolve([]);
    const tx = db.transaction(STORE_MSGS, 'readonly');
    const idx = tx.objectStore(STORE_MSGS).index('by_room');
    const req = idx.getAll(IDBKeyRange.only(room));
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function dbCountByRoom(room) {
  return new Promise((resolve) => {
    if (!db) return resolve(0);
    const tx = db.transaction(STORE_MSGS, 'readonly');
    const idx = tx.objectStore(STORE_MSGS).index('by_room');
    const req = idx.count(IDBKeyRange.only(room));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(0);
  });
}

async function dbTrim(room) {
  try {
    const count = await dbCountByRoom(room);
    if (count <= MAX_MSGS_PER_ROOM) return;
    const all = await dbGetAllByRoom(room);
    all.sort((a, b) => (a.time || 0) - (b.time || 0));
    const toDelete = all.slice(0, count - MAX_MSGS_PER_ROOM);
    await new Promise((resolve) => {
      const tx = db.transaction(STORE_MSGS, 'readwrite');
      const store = tx.objectStore(STORE_MSGS);
      toDelete.forEach(m => store.delete(m.msgId));
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {}
}

async function dbClearRoom(room) {
  try {
    const all = await dbGetAllByRoom(room);
    await new Promise((resolve) => {
      const tx = db.transaction(STORE_MSGS, 'readwrite');
      const store = tx.objectStore(STORE_MSGS);
      all.forEach(m => store.delete(m.msgId));
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {}
}

/* ============================================================
   Helpers
   ============================================================ */
function genMsgId() {
  return myId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function linkify(text) {
  const escaped = escapeHtml(text);
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  return escaped.replace(urlRegex, (url) => {
    const safe = url.replace(/"/g, '%22');
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${url}</a>`;
  });
}

function formatTime(ts) {
  try {
    return new Date(ts || Date.now()).toLocaleTimeString('fa-IR', {
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return ''; }
}

function formatDate(ts) {
  try {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date();
    yest.setDate(today.getDate() - 1);
    const sameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
    if (sameDay(d, today)) return 'امروز';
    if (sameDay(d, yest)) return 'دیروز';
    return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return ''; }
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(2) + ' MB';
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}

function setStatus(cls, text) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + cls;
  const enabled = (cls === 'online' || cls === 'syncing');
  msgInput.disabled = !enabled;
  sendBtn.disabled = !enabled;
  attachBtn.disabled = !enabled;
  if (micBtn) micBtn.disabled = !enabled;
}

function setUploadBar(text) {
  if (!text) { uploadBar.classList.remove('active'); uploadBar.textContent = ''; }
  else { uploadBar.classList.add('active'); uploadBar.textContent = text; }
}

function setNetBar(show, text) {
  if (show) {
    if (text) {
      netBar.innerHTML = '<svg class="ic ic-sm"><use href="#i-wifi-off"/></svg>' + text;
    }
    netBar.classList.add('active');
  } else {
    netBar.classList.remove('active');
  }
}

function getTextPreview(record) {
  if (!record) return '';
  if (record.type === 'image') return 'عکس';
  if (record.type === 'video') return 'ویدیو';
  if (record.type === 'voice') return 'پیام صوتی';
  if (record.type === 'file') return (record.file?.name || 'فایل');
  if (record.text) return record.text.slice(0, 80);
  return '';
}

/* ============================================================
   Render messages
   ============================================================ */
function isNearBottom() {
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
}
function scrollIfNeeded(wasNear) {
  if (wasNear) messagesEl.scrollTop = messagesEl.scrollHeight;
}

let lastRenderedDate = null;
function maybeAddDateDivider(time) {
  const dateKey = formatDate(time);
  if (dateKey !== lastRenderedDate) {
    lastRenderedDate = dateKey;
    const div = document.createElement('div');
    div.className = 'date-divider';
    div.textContent = dateKey;
    messagesEl.appendChild(div);
  }
}

/* Audio player */
function buildAudioPlayer(record) {
  const wrap = document.createElement('div');
  wrap.className = 'audio-player';

  const playBtn = document.createElement('button');
  playBtn.className = 'ap-play';
  playBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-play"/></svg>';

  const body = document.createElement('div');
  body.className = 'ap-body';

  const wave = document.createElement('div');
  wave.className = 'ap-wave';
  const BARS = 28;
  const bars = [];
  for (let i = 0; i < BARS; i++) {
    const s = document.createElement('span');
    const seed = (record.msgId || '').split('').reduce((a,c)=>a+c.charCodeAt(0),0) + i * 37;
    const h = 6 + (Math.abs(Math.sin(seed)) * 14);
    s.style.height = h.toFixed(1) + 'px';
    wave.appendChild(s);
    bars.push(s);
  }

  const time = document.createElement('div');
  time.className = 'ap-time';
  const dur = record.duration || 0;
  time.textContent = formatDuration(dur);

  body.appendChild(wave);
  body.appendChild(time);

  wrap.appendChild(playBtn);
  wrap.appendChild(body);

  const audio = new Audio(record.voice);
  audio.preload = 'metadata';

  let raf = null;
  function updateProgress() {
    if (!audio.duration || !isFinite(audio.duration)) { raf = requestAnimationFrame(updateProgress); return; }
    const p = audio.currentTime / audio.duration;
    const filled = Math.floor(p * BARS);
    bars.forEach((b, i) => b.classList.toggle('played', i < filled));
    time.textContent = formatDuration(audio.currentTime * 1000) + ' / ' + formatDuration(audio.duration * 1000);
    if (!audio.paused) raf = requestAnimationFrame(updateProgress);
  }

  playBtn.onclick = (e) => {
    e.stopPropagation();
    if (audio.paused) {
      document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
      audio.play().catch(()=>{});
    } else {
      audio.pause();
    }
  };
  audio.onplay = () => {
    playBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-pause"/></svg>';
    bars.forEach(b => b.classList.remove('played'));
    updateProgress();
  };
  audio.onpause = () => {
    playBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-play"/></svg>';
    if (raf) cancelAnimationFrame(raf);
  };
  audio.onended = () => {
    playBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-play"/></svg>';
    bars.forEach(b => b.classList.add('played'));
    if (raf) cancelAnimationFrame(raf);
    time.textContent = formatDuration(dur);
  };

  wrap._audio = audio;
  return wrap;
}

function buildMessageElement(record) {
  const isMine = record.from === myId;
  const type = isMine ? 'me' : 'them';
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.dataset.msgId = record.msgId;
  div.dataset.from = record.from || '';

  if (record.sender && !isMine) {
    const s = document.createElement('span');
    s.className = 'sender';
    s.innerHTML = '<svg class="ic ic-sm" style="width:12px;height:12px"><use href="#i-user"/></svg>' + escapeHtml(record.sender);
    div.appendChild(s);
  }

  if (record.replyTo) {
    const q = document.createElement('span');
    q.className = 'quote';
    q.textContent = (record.replyTo.sender || '') + ': ' + (record.replyTo.text || '').slice(0, 60);
    div.appendChild(q);
  }

  const body = document.createElement('div');
  body.className = 'msg-body';

  if (record.type === 'image' && record.image) {
    const img = document.createElement('img');
    img.src = record.image;
    img.alt = 'عکس';
    img.onclick = () => openLightboxImage(record.image);
    body.appendChild(img);
  } else if (record.type === 'video' && record.video) {
    const video = document.createElement('video');
    video.src = record.video;
    video.controls = true;
    video.preload = 'metadata';
    body.appendChild(video);
  } else if (record.type === 'voice' && record.voice) {
    body.appendChild(buildAudioPlayer(record));
  } else if (record.type === 'file' && record.file) {
    const link = document.createElement('a');
    link.className = 'file-card';
    link.href = record.file.data;
    link.download = record.file.name || 'file';
    link.innerHTML = `
      <span class="icon"><svg class="ic"><use href="#i-file"/></svg></span>
      <span class="info">
        <div class="name">${escapeHtml(record.file.name || 'فایل')}</div>
        <div class="size">${escapeHtml(formatBytes(record.file.size || 0))}</div>
      </span>
    `;
    body.appendChild(link);
  } else if (record.text) {
    body.innerHTML = linkify(record.text);
  }
  div.appendChild(body);

  const meta = document.createElement('span');
  meta.className = 'meta';
  if (isMine) {
    const tick = document.createElement('span');
    tick.className = 'tick' + (record.read ? ' read' : '');
    tick.innerHTML = record.read
      ? '<svg><use href="#i-check-check"/></svg>'
      : '<svg><use href="#i-check"/></svg>';
    meta.appendChild(tick);
  }
  const timeSpan = document.createElement('span');
  timeSpan.textContent = formatTime(record.time);
  meta.appendChild(timeSpan);
  if (record.edited) {
    const editedMark = document.createElement('span');
    editedMark.className = 'edited-mark';
    editedMark.textContent = ' (ویرایش شده)';
    meta.appendChild(editedMark);
  }
  div.appendChild(meta);

  const reactionsEl = document.createElement('div');
  reactionsEl.className = 'reactions';
  div.appendChild(reactionsEl);
  updateReactionsUI(reactionsEl, record.reactions || {});

  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  let actionsHTML = `
    <button data-action="reply" title="پاسخ"><svg class="ic ic-sm"><use href="#i-reply"/></svg></button>
    <button data-action="react" title="واکنش"><svg class="ic ic-sm"><use href="#i-smile"/></svg></button>
    <button data-action="pin" title="پین"><svg class="ic ic-sm"><use href="#i-pin"/></svg></button>
  `;

  if (isMine && record.type !== 'system') {
    if (!record.type || record.type === 'message') {
      actionsHTML += `<button data-action="edit" title="ویرایش"><svg class="ic ic-sm"><use href="#i-edit"/></svg></button>`;
    }
    actionsHTML += `<button data-action="delete" title="حذف" class="danger"><svg class="ic ic-sm"><use href="#i-trash"/></svg></button>`;
  }

  actions.innerHTML = actionsHTML;
  div.appendChild(actions);

  actions.querySelector('[data-action="reply"]').onclick = (e) => {
    e.stopPropagation();
    startReply(record);
  };
  actions.querySelector('[data-action="react"]').onclick = (e) => {
    e.stopPropagation();
    openReactionPicker(e.currentTarget, record.msgId);
  };
  actions.querySelector('[data-action="pin"]').onclick = (e) => {
    e.stopPropagation();
    togglePin(record);
  };

  const editBtn = actions.querySelector('[data-action="edit"]');
  if (editBtn) {
    editBtn.onclick = (e) => {
      e.stopPropagation();
      startEdit(record);
    };
  }

  const deleteBtn = actions.querySelector('[data-action="delete"]');
  if (deleteBtn) {
    deleteBtn.onclick = async (e) => {
      e.stopPropagation();
      const ok = await showConfirm('حذف پیام', 'این پیام برای همه حذف بشه؟', 'حذف');
      if (!ok) return;
      deleteMessage(record.msgId, true);
    };
  }

  return div;
}

function addOrUpdateMessage(record, prepend = false) {
  if (messagesCache.has(record.msgId)) {
    const existing = messagesCache.get(record.msgId);
    if (existing.element && existing.element.parentNode) {
      existing.element.remove();
    }
  }
  const wasNear = isNearBottom();
  const el = buildMessageElement(record);
  if (prepend) {
    messagesEl.prepend(el);
  } else {
    if (!prepend) maybeAddDateDivider(record.time);
    messagesEl.appendChild(el);
  }
  messagesCache.set(record.msgId, { element: el, record });
  scrollIfNeeded(wasNear);
  return el;
}

function removeMessageElement(msgId) {
  const item = messagesCache.get(msgId);
  if (item && item.element && item.element.parentNode) {
    item.element.remove();
    if (item.element._audio) { try { item.element._audio.pause(); } catch {} }
  }
  messagesCache.delete(msgId);
}

/* Reactions */
function updateReactionsUI(el, reactions) {
  el.innerHTML = '';
  const entries = Object.entries(reactions || {});
  if (!entries.length) return;
  const counts = {};
  entries.forEach(([userId, emoji]) => {
    if (!emoji) return;
    counts[emoji] = counts[emoji] || { count: 0, mine: false };
    counts[emoji].count++;
    if (userId === myId) counts[emoji].mine = true;
  });
  Object.entries(counts).forEach(([emoji, info]) => {
    const span = document.createElement('span');
    span.className = 'reaction' + (info.mine ? ' mine' : '');
    span.textContent = emoji + ' ' + info.count;
    span.onclick = () => sendReaction(el.parentNode.dataset.msgId, emoji);
    el.appendChild(span);
  });
}

function openReactionPicker(anchorEl, msgId) {
  const rect = anchorEl.getBoundingClientRect();
  reactionPicker.style.top = (rect.top + 30) + 'px';
  reactionPicker.style.left = Math.max(10, rect.left - 80) + 'px';
  reactionPicker.classList.add('active');
  reactionPicker.dataset.msgId = msgId;
}
reactionPicker.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    const msgId = reactionPicker.dataset.msgId;
    const emoji = btn.dataset.emoji;
    reactionPicker.classList.remove('active');
    if (msgId) sendReaction(msgId, emoji);
  };
});

async function sendReaction(msgId, emoji) {
  const item = messagesCache.get(msgId);
  if (!item) return;
  const record = item.record;
  record.reactions = record.reactions || {};
  if (record.reactions[myId] === emoji) {
    delete record.reactions[myId];
  } else {
    record.reactions[myId] = emoji;
  }
  updateReactionsUI(item.element.querySelector('.reactions'), record.reactions);
  dbUpdate(msgId, { reactions: record.reactions });
  safePublish({
    type: 'reaction',
    from: myId,
    sender: myName,
    msgId,
    emoji: record.reactions[myId] || null,
    time: Date.now()
  });
}

/* Reply */
function startReply(record) {
  replyTo = {
    msgId: record.msgId,
    sender: record.sender || 'کاربر',
    text: getTextPreview(record)
  };
  rpName.textContent = replyTo.sender;
  rpText.textContent = replyTo.text;
  replyPreview.classList.add('active');
  msgInput.focus();
}
rpClose.onclick = () => {
  replyTo = null;
  replyPreview.classList.remove('active');
};

/* Edit */
function startEdit(record) {
  if (record.from !== myId) {
    showToast('فقط پیام‌های خودت رو می‌تونی ویرایش کنی', 1800, true);
    return;
  }
  if (record.type && record.type !== 'message') {
    showToast('این نوع پیام قابل ویرایش نیست', 1800, true);
    return;
  }

  const item = messagesCache.get(record.msgId);
  if (!item) return;

  const body = item.element.querySelector('.msg-body');
  if (!body) return;

  if (body.querySelector('.edit-input')) return;

  const originalHTML = body.innerHTML;
  const originalText = record.text || '';

  body.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'edit-input';
  input.value = originalText;
  input.maxLength = 2000;
  input.style.cssText = `
    width: 100%;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.25);
    color: inherit;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
  `;
  body.appendChild(input);

  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:10px;opacity:0.7;margin-top:4px';
  hint.textContent = 'Enter = ذخیره | Esc = انصراف';
  body.appendChild(hint);

  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;

    const newText = input.value.trim();

    if (save && newText && newText !== originalText) {
      record.text = newText;
      record.edited = true;
      record.editedAt = Date.now();

      body.innerHTML = linkify(newText);
      updateEditedMark(item.element, record);

      dbUpdate(record.msgId, {
        text: newText,
        edited: true,
        editedAt: record.editedAt
      });

      safePublish({
        type: 'edit',
        from: myId,
        sender: myName,
        msgId: record.msgId,
        newText,
        editedAt: record.editedAt,
        time: Date.now()
      });

      showToast('پیام ویرایش شد', 1200);
    } else {
      body.innerHTML = originalHTML;
    }
  };

  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      finish(true);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      finish(false);
    }
  };

  input.onblur = () => {
    setTimeout(() => finish(true), 100);
  };
}

function updateEditedMark(msgEl, record) {
  const meta = msgEl.querySelector('.meta');
  if (!meta) return;

  let mark = meta.querySelector('.edited-mark');

  if (record.edited) {
    if (!mark) {
      mark = document.createElement('span');
      mark.className = 'edited-mark';
      mark.textContent = ' (ویرایش شده)';
      meta.appendChild(mark);
    }
  } else if (mark) {
    mark.remove();
  }
}

/* Image compression */
function compressImage(file, maxBytes) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        let quality = 0.85;
        const MAX_DIM = 1280;
        if (width > MAX_DIM || height > MAX_DIM) {
          const r = Math.min(MAX_DIM / width, MAX_DIM / height);
          width = Math.round(width * r);
          height = Math.round(height * r);
        }
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        function tryRender(q) {
          canvas.width = width; canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          return canvas.toDataURL('image/jpeg', q);
        }
        let dataUrl = tryRender(quality);
        let attempts = 0;
        while (dataUrl.length * 0.75 > maxBytes && attempts < 18) {
          attempts++;
          if (quality > 0.4) quality -= 0.1;
          else { width = Math.round(width * 0.8); height = Math.round(height * 0.8); quality = 0.7; }
          dataUrl = tryRender(quality);
        }
        if (dataUrl.length * 0.75 > maxBytes) reject(new Error('عکس حتی بعد از فشرده‌سازی خیلی بزرگه'));
        else resolve(dataUrl);
      };
      img.onerror = () => reject(new Error('عکس نامعتبره'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function checkPayloadFits(payload, limitBytes = 950 * 1024) {
  try {
    const json = JSON.stringify(payload);
    return json.length * 2 <= limitBytes * 2;
  } catch { return false; }
}

/* Store incoming */
async function storeIncomingMessage(data) {
  if (!data.msgId) data.msgId = genMsgId();
  if (!data.time) data.time = Date.now();

  const exists = await dbHas(data.msgId);
  if (exists) return false;

  const record = {
    msgId: data.msgId,
    room: currentRoom,
    from: data.from,
    sender: data.sender || 'کاربر',
    type: data.type || 'message',
    text: data.text || '',
    image: data.image || null,
    video: data.video || null,
    voice: data.voice || null,
    duration: data.duration || 0,
    file: data.file || null,
    replyTo: data.replyTo || null,
    reactions: data.reactions || {},
    edited: data.edited || false,
    editedAt: data.editedAt || null,
    read: false,
    time: data.time
  };
  try { await dbAdd(record); } catch {}
  dbTrim(currentRoom);
  addOrUpdateMessage(record);
  return true;
}

/* Connection */
function clearTimers() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
}

function startHeartbeat(seq) {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => {
    if (seq !== connectSeq) return;
    if (!client || !isConnected) return;
    try {
      client.publish(currentTopic, JSON.stringify({
        type: 'ping', from: myId, time: Date.now()
      }), { qos: 0 });
    } catch {}
  }, HEARTBEAT_INTERVAL);
}

function startPresence(seq) {
  if (presenceTimer) clearInterval(presenceTimer);
  presenceTick();
  presenceTimer = setInterval(() => {
    if (seq !== connectSeq) return;
    if (!client || !isConnected) return;
    presenceTick();
  }, PRESENCE_INTERVAL);
}

function startWatchdog(seq) {
  if (watchdogTimer) clearInterval(watchdogTimer);
  watchdogTimer = setInterval(() => {
    if (seq !== connectSeq) return;
    if (!client) return;

    if (!navigator.onLine) {
      setNetBar(true, ' اتصال اینترنت قطع است — در انتظار بازگشت...');
      return;
    } else {
      setNetBar(false);
    }

    const stale = Date.now() - lastServerActivity;
    if (isConnected && stale > STALE_THRESHOLD) {
      tryReconnect('watchdog: silence');
    }
    if (!isConnected && client && !intentionalDisconnect) {
      tryReconnect('watchdog: disconnected');
    }
  }, WATCHDOG_INTERVAL);
}

function tryReconnect(reason) {
  const now = Date.now();
  if (now - lastReconnectAt < RECONNECT_COOLDOWN) return;
  lastReconnectAt = now;

  if (!client) return;
  try {
    if (typeof client.reconnect === 'function') {
      client.reconnect();
      return;
    }
  } catch {}

  try { client.end(true); } catch {}
  setTimeout(() => connect(), 500);
}

function connect() {
  const room = roomInput.value.trim() || 'default-room';
  localStorage.setItem(STORAGE_KEY_ROOM, room);
  currentRoom = room;
  currentTopic = 'chat/' + room;
  const mySeq = ++connectSeq;

  messagesEl.innerHTML = '';
  messagesCache.clear();
  lastRenderedDate = null;
  onlineUsers.forEach(u => u.timer && clearTimeout(u.timer));
  onlineUsers.clear();
  renderOnlineUsers();
  setUploadBar('');
  clearTimers();

  intentionalDisconnect = false;

  if (client) {
    try { client.end(true); } catch {}
    client = null;
  }

  setStatus('offline', 'در حال اتصال...');
  showToast('در حال اتصال...', 1500);

  const clientId = 'web_' + myId;

  function doConnect(useSSL = true) {
    const url = useSSL
      ? 'wss://broker.emqx.io:8084/mqtt'
      : 'ws://broker.emqx.io:8083/mqtt';

    const opts = {
      clientId,
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 2000,
      keepalive: 30,
      resubscribe: true,
      protocolVersion: 4,
    };

    try {
      client = mqtt.connect(url, opts);
    } catch (e) {
      if (useSSL) { doConnect(false); return; }
      showToast('خطا در ساخت کلاینت', 2500, true);
      setStatus('offline', 'آفلاین');
      return;
    }

    client.on('connect', onMqttConnect.bind(null, mySeq));
    client.on('message', (t, p) => onMqttMessage(t, p, mySeq));
    client.on('error', (err) => onMqttError(err, mySeq, useSSL, doConnect));
    client.on('close', () => onMqttClose(mySeq));
    client.on('offline', () => onMqttOffline(mySeq));
    client.on('reconnect', () => onMqttReconnect(mySeq));
  }

  doConnect(true);

  startHeartbeat(mySeq);
  startWatchdog(mySeq);
}

async function onMqttConnect(seq) {
  if (seq !== connectSeq) return;
  isConnected = true;
  lastServerActivity = Date.now();
  setStatus('online', 'آنلاین');
  setNetBar(false);

  const history = await dbGetAllByRoom(currentRoom);
  history.sort((a, b) => a.time - b.time);
  history.forEach(m => addOrUpdateMessage(m));

  if (history.length) showToast(`${history.length} پیام از حافظه لود شد`, 1500);

  trySubscribe(seq);
  startPresence(seq);

  safePublish({
    msgId: genMsgId(),
    type: 'system',
    text: `${myName} وارد شد`,
    from: myId,
    sender: myName,
    time: Date.now()
  });

  const savedPin = localStorage.getItem(STORAGE_KEY_PIN + currentRoom);
  if (savedPin) {
    const pinned = history.find(m => m.msgId === savedPin);
    if (pinned) {
      pinnedMessageId = savedPin;
      pinText.textContent = (pinned.sender || 'کاربر') + ': ' + getTextPreview(pinned);
      pinBar.classList.add('active');
    }
  }

  setTimeout(() => { if (seq === connectSeq) requestSync(); }, 1000);
}

function trySubscribe(seq) {
  if (!client || seq !== connectSeq) return;
  client.subscribe(currentTopic, { qos: 1 }, (err) => {
    if (seq !== connectSeq) return;
    if (err) {
      showToast('خطا در عضویت — تلاش مجدد...', 2000, true);
      setTimeout(() => trySubscribe(seq), 2500);
    }
  });
}

function onMqttError(err, seq, useSSL, doConnect) {
  if (seq !== connectSeq) return;
  console.warn('[mqtt] error:', err && err.message);
  if (!isConnected) setStatus('reconnecting', 'تلاش مجدد...');
  if (useSSL && err && /websocket|network|tls/i.test(String(err.message || ''))) {
    try { client && client.end(true); } catch {}
    setTimeout(() => doConnect(false), 800);
  }
}

function onMqttClose(seq) {
  if (seq !== connectSeq) return;
  isConnected = false;
  if (intentionalDisconnect) { setStatus('offline', 'آفلاین'); return; }
  setStatus('reconnecting', 'اتصال مجدد...');
}

function onMqttOffline(seq) {
  if (seq !== connectSeq) return;
  isConnected = false;
  if (intentionalDisconnect) return;
  setStatus('reconnecting', 'آفلاین — تلاش مجدد...');
}

function onMqttReconnect(seq) {
  if (seq !== connectSeq) return;
  setStatus('reconnecting', 'اتصال مجدد...');
}

/* Safe publish */
function safePublish(payload, opts = { qos: 1 }) {
  if (!client || !isConnected) return false;
  try {
    const json = JSON.stringify(payload);
    if (json.length > 1000 * 1024) {
      showToast('پیام بزرگ‌تر از حد مجازه', 2500, true);
      return false;
    }
    client.publish(currentTopic, json, opts);
    return true;
  } catch (e) {
    return false;
  }
}

/* Receive */
const recentSyncResponses = new Map();

async function onMqttMessage(topic, payload, seq) {
  if (seq !== connectSeq) return;
  lastServerActivity = Date.now();

  let data = null;
  const raw = payload.toString();

  try { data = JSON.parse(raw); }
  catch (e) {
    if (raw.trim()) {
      const fake = {
        msgId: genMsgId(),
        from: 'anon_' + Math.random().toString(36).slice(2, 6),
        sender: 'ناشناس',
        type: 'message',
        text: raw,
        time: Date.now()
      };
      await storeIncomingMessage(fake);
    }
    return;
  }

  if (!data || typeof data !== 'object') return;
  if (data.from === myId) return;

  if (data.type === 'ping') return;
  if (data.type === 'typing') { onRemoteTyping(data); return; }
  if (data.type === 'presence') { registerPresence(data); return; }

  if (data.type === 'reaction') {
    const item = messagesCache.get(data.msgId);
    if (item) {
      item.record.reactions = item.record.reactions || {};
      if (data.emoji) item.record.reactions[data.from] = data.emoji;
      else delete item.record.reactions[data.from];
      updateReactionsUI(item.element.querySelector('.reactions'), item.record.reactions);
      dbUpdate(data.msgId, { reactions: item.record.reactions });
    }
    return;
  }

  if (data.type === 'delete') {
    removeMessageElement(data.msgId);
    await dbDelete(data.msgId);
    return;
  }

  if (data.type === 'edit') {
    const item = messagesCache.get(data.msgId);
    if (item && item.record.from === data.from) {
      item.record.text = data.newText;
      item.record.edited = true;
      item.record.editedAt = data.editedAt;

      const body = item.element.querySelector('.msg-body');
      if (body) {
        body.innerHTML = linkify(data.newText);
      }
      updateEditedMark(item.element, item.record);

      dbUpdate(data.msgId, {
        text: data.newText,
        edited: true,
        editedAt: data.editedAt
      });
    }
    return;
  }

  if (data.type === 'pin') {
    pinnedMessageId = data.msgId;
    pinText.textContent = (data.pinnedBy || 'کاربر') + ': ' + (data.preview || '');
    pinBar.classList.add('active');
    showToast('پیام پین شد', 1200);
    return;
  }

  if (data.type === 'pin-remove') {
    pinnedMessageId = null;
    pinBar.classList.remove('active');
    return;
  }

  if (data.type === 'read-receipt') {
    const item = messagesCache.get(data.msgId);
    if (item && item.record.from === myId) {
      item.record.read = true;
      const tick = item.element.querySelector('.tick');
      if (tick) {
        tick.innerHTML = '<svg><use href="#i-check-check"/></svg>';
        tick.classList.add('read');
      }
      dbUpdate(data.msgId, { read: true });
    }
    return;
  }

  if (data.type === 'system') {
    showToast('• ' + (data.text || ''), 1200);
    return;
  }

  if (data.type === 'sync-request') { await handleSyncRequest(data); return; }

  if (data.type === 'sync-response') {
    if (data.to !== myId) return;
    const now = Date.now();
    if (now - (recentSyncResponses.get(data.from) || 0) < SYNC_DEDUP_WINDOW) return;
    recentSyncResponses.set(data.from, now);
    await handleSyncResponse(data);
    return;
  }

  const added = await storeIncomingMessage(data);
  if (added) {
    safePublish({
      type: 'read-receipt',
      from: myId,
      msgId: data.msgId,
      time: Date.now()
    }, { qos: 0 });
  }
}

/* Sync */
async function requestSync() {
  if (!client || !isConnected) return;
  const all = await dbGetAllByRoom(currentRoom);
  const lastTime = all.length ? Math.max(...all.map(m => m.time || 0)) : 0;

  setStatus('syncing', 'همگام‌سازی...');
  showToast('در حال همگام‌سازی...', 1500);

  safePublish({
    type: 'sync-request',
    from: myId,
    sinceTime: lastTime,
    time: Date.now()
  });

  setTimeout(() => { if (isConnected) setStatus('online', 'آنلاین'); }, 4000);
}

async function handleSyncRequest(req) {
  if (!client || !isConnected) return;
  const since = req.sinceTime || 0;
  const all = await dbGetAllByRoom(currentRoom);
  const toSend = all.filter(m => (m.time || 0) > since).sort((a, b) => a.time - b.time);
  if (!toSend.length) return;

  for (let i = 0; i < toSend.length; i += SYNC_CHUNK_SIZE) {
    const chunk = toSend.slice(i, i + SYNC_CHUNK_SIZE);
    const isLast = i + SYNC_CHUNK_SIZE >= toSend.length;
    safePublish({
      type: 'sync-response',
      from: myId,
      to: req.from,
      messages: chunk,
      isLast,
      time: Date.now()
    });
    await new Promise(r => setTimeout(r, 150));
  }
}

async function handleSyncResponse(resp) {
  if (!Array.isArray(resp.messages)) return;
  let newCount = 0;
  for (const m of resp.messages) {
    if (!m || !m.msgId) continue;
    const exists = await dbHas(m.msgId);
    if (exists) continue;
    const record = {
      msgId: m.msgId, room: currentRoom, from: m.from,
      sender: m.sender || 'کاربر',
      type: m.type || 'message',
      text: m.text || '',
      image: m.image || null,
      video: m.video || null,
      voice: m.voice || null,
      duration: m.duration || 0,
      file: m.file || null,
      replyTo: m.replyTo || null,
      reactions: m.reactions || {},
      edited: m.edited || false,
      editedAt: m.editedAt || null,
      read: m.read || false,
      time: m.time || Date.now()
    };
    try { await dbAdd(record); } catch {}
    addOrUpdateMessage(record);
    newCount++;
  }
  if (newCount > 0) {
    dbTrim(currentRoom);
    showToast(`${newCount} پیام جدید`, 1500);
  }
}

/* Send text */
async function send() {
  const text = msgInput.value.trim();
  if (!text) return;
  if (!client || !isConnected) {
    showToast('اتصال آماده نیست — صبر کن...', 2000, true);
    return;
  }

  const payload = {
    msgId: genMsgId(),
    type: 'message',
    from: myId,
    sender: myName,
    text,
    replyTo: replyTo ? { ...replyTo } : null,
    edited: false,
    time: Date.now()
  };

  addOrUpdateMessage({ ...payload, room: currentRoom, reactions: {}, read: false });
  dbAdd({
    ...payload, room: currentRoom, reactions: {}, read: false,
    image: null, video: null, voice: null, duration: 0, file: null
  }).then(() => dbTrim(currentRoom)).catch(() => {});

  const ok = safePublish(payload);
  if (!ok) showToast('ارسال نشد — دوباره امتحان کن', 2000, true);

  msgInput.value = '';
  replyTo = null;
  replyPreview.classList.remove('active');
  msgInput.focus();
}

/* Send file */
attachBtn.onclick = () => {
  if (!isConnected) { showToast('اتصال آماده نیست', 2000, true); return; }
  fileInput.click();
};

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  fileInput.value = '';

  const type = file.type || '';

  if (type.startsWith('image/')) {
    setUploadBar('در حال فشرده‌سازی عکس...');
    try {
      const dataUrl = await compressImage(file, MAX_IMAGE_BYTES);
      await sendMedia({ kind: 'image', dataUrl, name: file.name, size: file.size });
    } catch (err) {
      showToast('خطا: ' + err.message, 2800, true);
    } finally {
      setUploadBar('');
    }
    return;
  }

  if (file.size > MAX_FILE_BYTES) {
    showToast(
      `حجم فایل (${formatBytes(file.size)}) از حد مجاز (${formatBytes(MAX_FILE_BYTES)}) بیشتره`,
      3200, true
    );
    return;
  }

  setUploadBar(`آماده‌سازی (${formatBytes(file.size)})...`);
  try {
    const dataUrl = await fileToDataUrl(file);
    if (dataUrl.length > MAX_FILE_BYTES * 1.4) {
      showToast('فایل پس از تبدیل خیلی بزرگ شد', 2800, true);
      return;
    }
    const kind = type.startsWith('video/') ? 'video' : 'file';
    await sendMedia({ kind, dataUrl, name: file.name, size: file.size, mime: type });
  } catch (err) {
    showToast('خطا در خواندن فایل', 2500, true);
  } finally {
    setUploadBar('');
  }
};

async function sendMedia({ kind, dataUrl, name, size, mime, duration }) {
  if (!client || !isConnected) { showToast('اتصال آماده نیست', 2000, true); return; }

  let payload;
  if (kind === 'image') {
    payload = { msgId: genMsgId(), type: 'image', from: myId, sender: myName, image: dataUrl, time: Date.now() };
  } else if (kind === 'video') {
    payload = { msgId: genMsgId(), type: 'video', from: myId, sender: myName, video: dataUrl, time: Date.now() };
  } else if (kind === 'voice') {
    payload = {
      msgId: genMsgId(), type: 'voice', from: myId, sender: myName,
      voice: dataUrl, duration: duration || 0, time: Date.now()
    };
  } else {
    payload = {
      msgId: genMsgId(), type: 'file', from: myId, sender: myName,
      file: { data: dataUrl, name: name || 'file', size: size || 0, mime: mime || '' },
      time: Date.now()
    };
  }

  if (replyTo) payload.replyTo = { ...replyTo };

  if (!checkPayloadFits(payload, 950 * 1024)) {
    showToast('فایل بعد از پردازش برای MQTT خیلی بزرگه', 3000, true);
    return;
  }

  addOrUpdateMessage({ ...payload, room: currentRoom, reactions: {}, read: false });

  const record = {
    msgId: payload.msgId, room: currentRoom, from: myId, sender: myName,
    type: payload.type, text: '',
    image: payload.image || null,
    video: payload.video || null,
    voice: payload.voice || null,
    duration: payload.duration || 0,
    file: payload.file || null,
    replyTo: payload.replyTo || null,
    reactions: {}, edited: false, read: false, time: payload.time
  };
  dbAdd(record).then(() => dbTrim(currentRoom)).catch(() => {});

  const ok = safePublish(payload);
  if (!ok) showToast('ارسال فایل ناموفق بود', 2500, true);

  replyTo = null;
  replyPreview.classList.remove('active');
}

/* Voice recorder */
let mediaRecorder = null;
let recordedChunks = [];
let recordStartTime = 0;
let recordTimerInterval = null;
let recordStream = null;
let isRecording = false;
let cancelRecording = false;
let maxDurationTimeout = null;

const supportsMediaRecorder = typeof MediaRecorder !== 'undefined'
  && (navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

if (!supportsMediaRecorder) {
  micBtn.style.display = 'none';
}

function pickVoiceMime() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/ogg;codecs=opus',
    'audio/webm',
    'audio/mp4',
    'audio/ogg'
  ];
  for (const m of candidates) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

function updateRecTime() {
  const elapsed = Date.now() - recordStartTime;
  recTime.textContent = formatDuration(elapsed);
  if (elapsed >= VOICE_MAX_MS) {
    stopRecording(false);
  }
}

async function startRecording() {
  if (!isConnected) { showToast('اتصال آماده نیست', 2000, true); return; }
  if (isRecording) return;

  cancelRecording = false;

  try {
    recordStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });
  } catch (err) {
    showToast('دسترسی به میکروفون داده نشد', 2500, true);
    return;
  }

  const mimeType = pickVoiceMime();
  try {
    mediaRecorder = mimeType
      ? new MediaRecorder(recordStream, { mimeType, audioBitsPerSecond: VOICE_BITRATE })
      : new MediaRecorder(recordStream);
  } catch (err) {
    showToast('مرورگر از ضبط صدا پشتیبانی نمی‌کند', 2500, true);
    recordStream.getTracks().forEach(t => t.stop());
    recordStream = null;
    return;
  }

  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = async () => {
    const wasCanceled = cancelRecording;
    const durationMs = Date.now() - recordStartTime;

    if (recordStream) {
      recordStream.getTracks().forEach(t => t.stop());
      recordStream = null;
    }
    if (recordTimerInterval) {
      clearInterval(recordTimerInterval);
      recordTimerInterval = null;
    }
    if (maxDurationTimeout) {
      clearTimeout(maxDurationTimeout);
      maxDurationTimeout = null;
    }

    recordingBar.classList.remove('active');
    micBtn.classList.remove('recording');
    isRecording = false;

    if (wasCanceled) { showToast('ضبط لغو شد', 1200); return; }
    if (durationMs < 700) { showToast('ضبط خیلی کوتاه بود', 1500); return; }
    if (!recordedChunks.length) { showToast('چیزی ضبط نشد', 1500, true); return; }

    const blob = new Blob(recordedChunks, { type: recordedChunks[0].type || 'audio/webm' });
    recordedChunks = [];

    if (blob.size > MAX_VOICE_BYTES) {
      showToast(`ویس خیلی بزرگه (${formatBytes(blob.size)}) — کوتاه‌تر بگیر`, 3000, true);
      return;
    }

    try {
      setUploadBar('در حال آماده‌سازی ویس...');
      const dataUrl = await blobToDataUrl(blob);
      setUploadBar('');
      await sendMedia({
        kind: 'voice',
        dataUrl,
        duration: durationMs
      });
      showToast('ویس ارسال شد', 1200);
    } catch (err) {
      setUploadBar('');
      showToast('خطا در ارسال ویس', 2000, true);
    }
  };

  mediaRecorder.start(100);
  recordStartTime = Date.now();
  isRecording = true;
  recTime.textContent = '00:00';
  recHint.textContent = 'در حال ضبط...';
  recordingBar.classList.add('active');
  micBtn.classList.add('recording');

  recordTimerInterval = setInterval(updateRecTime, 200);
  maxDurationTimeout = setTimeout(() => stopRecording(false), VOICE_MAX_MS + 200);
}

function stopRecording(cancel) {
  if (!isRecording || !mediaRecorder) return;
  cancelRecording = !!cancel;
  try {
    if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  } catch {}
  isRecording = false;
  micBtn.classList.remove('recording');
  recordingBar.classList.remove('active');
  if (recordTimerInterval) { clearInterval(recordTimerInterval); recordTimerInterval = null; }
  if (maxDurationTimeout) { clearTimeout(maxDurationTimeout); maxDurationTimeout = null; }
}

micBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if (micBtn.disabled) return;
  if (isRecording) return;
  startRecording();
});

micBtn.addEventListener('contextmenu', (e) => e.preventDefault());

recSend.onclick = () => {
  if (isRecording) stopRecording(false);
};

recCancel.onclick = () => {
  if (isRecording) stopRecording(true);
};

/* Connect / Disconnect */
connectBtn.onclick = () => {
  if (client && isConnected) {
    intentionalDisconnect = true;
    clearTimers();
    try { client.end(true); } catch {}
    isConnected = false;
    setStatus('offline', 'آفلاین');
    connectBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-sparkles"/></svg>اتصال';
  } else {
    connect();
    connectBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-x"/></svg>قطع';
  }
};

sendBtn.onclick = send;
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
msgInput.addEventListener('input', onLocalTyping);

/* Export / Clear */
exportBtn.onclick = async () => {
  menuPopup.classList.remove('active');
  const all = await dbGetAllByRoom(currentRoom);
  if (!all.length) { showToast('چیزی برای خروجی نیست', 1500, true); return; }
  all.sort((a, b) => a.time - b.time);
  const lines = all.map(m => {
    const t = new Date(m.time).toLocaleString('fa-IR');
    const who = m.from === myId ? myName : (m.sender || 'کاربر');
    let content = '';
    if (m.type === 'image') content = '[عکس]';
    else if (m.type === 'video') content = '[ویدیو]';
    else if (m.type === 'voice') content = '[ویس ' + formatDuration(m.duration || 0) + ']';
    else if (m.type === 'file') content = '[فایل: ' + (m.file?.name || '') + ']';
    else content = m.text || '';
    if (m.edited) content += ' (ویرایش شده)';
    return `[${t}] ${who}: ${content}`;
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chat-${currentRoom}-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('خروجی گرفته شد', 1500);
};

clearChatBtn.onclick = async () => {
  menuPopup.classList.remove('active');
  const ok = await showConfirm('پاک کردن چت', 'همه‌ی پیام‌های این اتاق پاک می‌شن. مطمئنی؟', 'پاک کن');
  if (!ok) return;
  await dbClearRoom(currentRoom);
  messagesEl.innerHTML = '';
  messagesCache.clear();
  lastRenderedDate = null;
  pinnedMessageId = null;
  pinBar.classList.remove('active');
  showToast('چت پاک شد', 1500);
};

/* Network events */
window.addEventListener('online', () => {
  setNetBar(false);
  if (intentionalDisconnect) return;
  if (!isConnected && client) tryReconnect('network: online');
  else if (client && isConnected) showToast('اتصال اینترنت برگشت', 1500);
});

window.addEventListener('offline', () => {
  setNetBar(true, ' اتصال اینترنت قطع است — در انتظار بازگشت...');
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !intentionalDisconnect) {
    if (!isConnected && client) tryReconnect('visibility: back');
    else if (client && isConnected && Date.now() - lastServerActivity > STALE_THRESHOLD) {
      tryReconnect('visibility: stale');
    }
  }
});

window.addEventListener('beforeunload', () => {
  intentionalDisconnect = true;
  clearTimers();
  try { client && client.end(true); } catch {}
  if (recordStream) recordStream.getTracks().forEach(t => t.stop());
});

/* Helpers */
function getOrCreateUserId() {
  let id = localStorage.getItem(STORAGE_KEY_ID);
  if (!id) {
    id = 'user_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(STORAGE_KEY_ID, id);
  }
  return id;
}

/* Lobby */
function showLobby(name) {
  myName = name;
  localStorage.setItem(STORAGE_KEY_NAME, name);
  meLabel.textContent = `شما: ${name}`;
  lobbyName.innerHTML = '<svg class="ic ic-sm"><use href="#i-user"/></svg>' + name;

  const savedRoom = localStorage.getItem(STORAGE_KEY_ROOM);
  if (savedRoom) {
    lobbyRoomInput.value = savedRoom;
    roomInput.value = savedRoom;
  }

  lobbyOverlay.classList.remove('hidden');
  lobbyRoomInput.focus();
  lobbyRoomInput.select();
}

function enterChatFromLobby() {
  const room = lobbyRoomInput.value.trim() || 'chat-room-123';
  roomInput.value = room;
  localStorage.setItem(STORAGE_KEY_ROOM, room);

  lobbyOverlay.classList.add('hidden');
  connectBtn.innerHTML = '<svg class="ic ic-sm"><use href="#i-x"/></svg>قطع';
  connect();
}

lobbyConnectBtn.onclick = () => {
  const room = lobbyRoomInput.value.trim();
  if (!room) {
    showToast('لطفاً نام اتاق را وارد کن', 1800, true);
    lobbyRoomInput.focus();
    return;
  }
  enterChatFromLobby();
};

lobbyRoomInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    lobbyConnectBtn.click();
  }
});

/* Name gate */
function setupNameGate() {
  const savedName = localStorage.getItem(STORAGE_KEY_NAME);
  if (savedName) {
    nameGate.classList.add('hidden');
    showLobby(savedName);
    return;
  }

  nameGate.classList.remove('hidden');
  nameInput.focus();
  nameInput.addEventListener('input', () => {
    nameSubmit.disabled = !nameInput.value.trim();
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && nameInput.value.trim()) {
      const n = nameInput.value.trim().slice(0, 24);
      nameGate.classList.add('hidden');
      showLobby(n);
    }
  });
  nameSubmit.onclick = () => {
    const v = nameInput.value.trim().slice(0, 24);
    if (v) {
      nameGate.classList.add('hidden');
      showLobby(v);
    }
  };
}

/* Init */
(async function init() {
  myId = getOrCreateUserId();

  const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
  applyTheme(savedTheme);

  const savedColor = localStorage.getItem(STORAGE_KEY_COLOR) || '#3b82f6';
  applyAccent(savedColor);

  try { db = await openDb(); }
  catch (e) { alert('خطا در باز کردن دیتابیس مرورگر'); }

  const savedRoom = localStorage.getItem(STORAGE_KEY_ROOM);
  if (savedRoom) {
    roomInput.value = savedRoom;
    lobbyRoomInput.value = savedRoom;
  }

  if (!navigator.onLine) setNetBar(true, ' اتصال اینترنت قطع است — در انتظار بازگشت...');

  renderOnlineUsers();
  setupNameGate();
})();
</script>
